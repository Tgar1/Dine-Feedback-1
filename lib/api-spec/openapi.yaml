openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: feedback
    description: Customer feedback operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /feedback:
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit customer feedback
      description: Stores a quick customer feedback response without requiring an account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackReceipt"
        "400":
          description: Invalid feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FeedbackInput:
      type: object
      properties:
        rating:
          type: number
          format: double
          minimum: 1
          maximum: 5
          description: Overall visit rating from 1 to 5
        painPoint:
          type: ["string", "null"]
          enum:
            - food
            - service
            - waiting
            - cleanliness
            - atmosphere
            - ambience
            - value
            - delivery
            - other
            - none # for good/excellent ratings
          description: The area that could be improved most, or 'none' for positive feedback.
        location:
          type: ["string", "null"]
          maxLength: 80
          description: Restaurant location from the QR code
        # Good experience flow
        enjoyedMost:
          type: ["string", "null"]
          description: For good ratings, what the user enjoyed most.
        improvementSuggestion:
          type: ["string", "null"]
          description: For good ratings, what would make the next visit even better.
        # Cascading issue fields
        primaryIssue:
          type: ["string", "null"]
          description: The primary issue selected within a pain point category (e.g., 'Taste' for 'Food').
        secondaryIssue:
          type: ["string", "null"]
          description: The secondary, more specific issue (e.g., 'Too salty' for 'Taste').
        rootCause:
          type: ["string", "null"]
          description: The most specific diagnosis captured by the cascade. Normally mirrors secondaryIssue.
        feedbackType:
          type: ["string", "null"]
          enum: [positive, neutral, negative, null]
        category:
          type: ["string", "null"]
        attribute:
          type: ["string", "null"]
        specificDetail:
          type: ["string", "null"]
          maxLength: 1000
        dish:
          type: ["string", "null"]
          maxLength: 200
        # Specific follow-up answers
        waitingTime:
          type: ["string", "null"]
          description: The approximate waiting time reported by the user.
        # Final catch-all comment
        finalComment:
          type: ["string", "null"]
          maxLength: 1000
          description: Optional final open-ended comment from the user.
      required:
        - rating
        - painPoint
        - location
    FeedbackReceipt:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
      required:
        - id
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
